<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="lBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0015"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="400" height="260" rx="12" fill="url(#lBg)" stroke="#2d1b3d" stroke-width="1"/>

  <text class="mono" x="200" y="28" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700" letter-spacing="3" opacity="0">
    ⟨ TOP LANGUAGES /⟩
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.4s" fill="freeze"/>
  </text>

  <!-- JavaScript -->
  <g transform="translate(24, 50)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.3s" fill="freeze"/>
    <text class="mono" x="0" y="12" fill="#b794d0" font-size="11">JavaScript</text>
    <text class="mono" x="352" y="12" fill="#f0db4f" font-size="11" font-weight="700" text-anchor="end">38%</text>
    <rect x="0" y="18" width="352" height="8" rx="4" fill="#1a0a2e" stroke="#2d1b3d" stroke-width="0.5"/>
    <rect x="0" y="18" width="0" height="8" rx="4" fill="#f0db4f">
      <animate attributeName="width" from="0" to="134" begin="0.8s" dur="0.8s" fill="freeze"/>
    </rect>
  </g>

  <!-- HTML/CSS -->
  <g transform="translate(24, 90)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.3s" fill="freeze"/>
    <text class="mono" x="0" y="12" fill="#b794d0" font-size="11">HTML / CSS</text>
    <text class="mono" x="352" y="12" fill="#e34c26" font-size="11" font-weight="700" text-anchor="end">28%</text>
    <rect x="0" y="18" width="352" height="8" rx="4" fill="#1a0a2e" stroke="#2d1b3d" stroke-width="0.5"/>
    <rect x="0" y="18" width="0" height="8" rx="4" fill="#e34c26">
      <animate attributeName="width" from="0" to="99" begin="1.0s" dur="0.8s" fill="freeze"/>
    </rect>
  </g>

  <!-- React/JSX -->
  <g transform="translate(24, 130)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.3s" fill="freeze"/>
    <text class="mono" x="0" y="12" fill="#b794d0" font-size="11">React / JSX</text>
    <text class="mono" x="352" y="12" fill="#61dafb" font-size="11" font-weight="700" text-anchor="end">18%</text>
    <rect x="0" y="18" width="352" height="8" rx="4" fill="#1a0a2e" stroke="#2d1b3d" stroke-width="0.5"/>
    <rect x="0" y="18" width="0" height="8" rx="4" fill="#61dafb">
      <animate attributeName="width" from="0" to="63" begin="1.2s" dur="0.8s" fill="freeze"/>
    </rect>
  </g>

  <!-- Node.js -->
  <g transform="translate(24, 170)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.3s" fill="freeze"/>
    <text class="mono" x="0" y="12" fill="#b794d0" font-size="11">Node.js</text>
    <text class="mono" x="352" y="12" fill="#68a063" font-size="11" font-weight="700" text-anchor="end">10%</text>
    <rect x="0" y="18" width="352" height="8" rx="4" fill="#1a0a2e" stroke="#2d1b3d" stroke-width="0.5"/>
    <rect x="0" y="18" width="0" height="8" rx="4" fill="#68a063">
      <animate attributeName="width" from="0" to="35" begin="1.4s" dur="0.8s" fill="freeze"/>
    </rect>
  </g>

  <!-- Other -->
  <g transform="translate(24, 210)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.3s" fill="freeze"/>
    <text class="mono" x="0" y="12" fill="#b794d0" font-size="11">Other</text>
    <text class="mono" x="352" y="12" fill="#c084fc" font-size="11" font-weight="700" text-anchor="end">6%</text>
    <rect x="0" y="18" width="352" height="8" rx="4" fill="#1a0a2e" stroke="#2d1b3d" stroke-width="0.5"/>
    <rect x="0" y="18" width="0" height="8" rx="4" fill="#c084fc">
      <animate attributeName="width" from="0" to="21" begin="1.6s" dur="0.8s" fill="freeze"/>
    </rect>
  </g>

  <rect width="400" height="260" rx="12" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.15">
    <animate attributeName="stroke-opacity" values="0.1;0.25;0.1" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>