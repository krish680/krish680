<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220">
  <defs>
    <linearGradient id="sRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="sBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0015"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <filter id="sGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
      <feFlood flood-color="#ff6b9d" flood-opacity="0.4"/>
      <feComposite operator="in" in2="SourceGraphic"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="500" height="220" rx="12" fill="url(#sBg)" stroke="#2d1b3d" stroke-width="1"/>

  <!-- Title -->
  <text class="mono" x="250" y="24" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700" letter-spacing="3" opacity="0">
    ⟨ GITHUB STATS /⟩
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.4s" fill="freeze"/>
  </text>

  <!-- Rank ring -->
  <g transform="translate(80, 125)">
    <!-- Background ring -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#1a0a2e" stroke-width="8"/>
    <!-- Animated ring -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#sRingGrad)" stroke-width="8"
            stroke-dasharray="345.6" stroke-dashoffset="345.6" stroke-linecap="round"
            transform="rotate(-90)" filter="url(#sGlow)">
      <animate attributeName="stroke-dashoffset" from="345.6" to="69" begin="0.5s" dur="1.5s" fill="freeze"/>
    </circle>
    <!-- Rank text -->
    <text class="mono" x="0" y="-8" text-anchor="middle" fill="#ff6b9d" font-size="28" font-weight="700" opacity="0">
      A+
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.3s" fill="freeze"/>
    </text>
    <text class="mono" x="0" y="12" text-anchor="middle" fill="#b794d0" font-size="10" opacity="0">
      RANK
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.3s" fill="freeze"/>
    </text>
  </g>

  <!-- Stat rows sliding in from right -->
  <g transform="translate(170, 55)">
    <!-- Total Stars -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="30,0" to="0,0" begin="0.8s" dur="0.4s" fill="freeze"/>
      <text class="mono" x="0" y="0" fill="#b794d0" font-size="12">⭐ Total Stars</text>
      <text class="mono" x="270" y="0" fill="#ff6b9d" font-size="12" font-weight="700" text-anchor="end">42</text>
    </g>
    <!-- Total Commits -->
    <g transform="translate(0,28)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="30,28" to="0,28" begin="1.0s" dur="0.4s" fill="freeze"/>
      <text class="mono" x="0" y="0" fill="#b794d0" font-size="12">🔥 Total Commits</text>
      <text class="mono" x="270" y="0" fill="#ff6b9d" font-size="12" font-weight="700" text-anchor="end">256</text>
    </g>
    <!-- PRs -->
    <g transform="translate(0,56)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="30,56" to="0,56" begin="1.2s" dur="0.4s" fill="freeze"/>
      <text class="mono" x="0" y="0" fill="#b794d0" font-size="12">🔀 Pull Requests</text>
      <text class="mono" x="270" y="0" fill="#ff6b9d" font-size="12" font-weight="700" text-anchor="end">18</text>
    </g>
    <!-- Issues -->
    <g transform="translate(0,84)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="30,84" to="0,84" begin="1.4s" dur="0.4s" fill="freeze"/>
      <text class="mono" x="0" y="0" fill="#b794d0" font-size="12">❗ Issues</text>
      <text class="mono" x="270" y="0" fill="#ff6b9d" font-size="12" font-weight="700" text-anchor="end">12</text>
    </g>
    <!-- Contributed To -->
    <g transform="translate(0,112)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="30,112" to="0,112" begin="1.6s" dur="0.4s" fill="freeze"/>
      <text class="mono" x="0" y="0" fill="#b794d0" font-size="12">📦 Contributed To</text>
      <text class="mono" x="270" y="0" fill="#ff6b9d" font-size="12" font-weight="700" text-anchor="end">8</text>
    </g>
  </g>

  <!-- Bottom border glow -->
  <rect width="500" height="220" rx="12" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.2">
    <animate attributeName="stroke-opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>