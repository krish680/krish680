<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="400" height="700">
  <defs>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d6336c"/>
      <stop offset="50%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#d6336c"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>

    <linearGradient id="avatarRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b9d">
        <animate attributeName="stop-color" values="#ff6b9d;#c084fc;#ff6b9d" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#ff6b9d;#c084fc" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="holoShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <filter id="ringGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ff6b9d" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="metalShine" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feFlood flood-color="#fff" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="avatarClip">
      <circle cx="200" cy="370" r="42"/>
    </clipPath>

    <clipPath id="cardClip">
      <rect x="120" y="290" width="160" height="260" rx="12"/>
    </clipPath>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Courier New', 'Consolas', monospace; }
    </style>
  </defs>

  <!-- Entire lanyard swings from anchor point at top center -->
  <g>
    <!-- Drop-in animation: starts from y=-400, drops to y=0 -->
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,-400;0,30;0,-15;0,10;0,-5;0,2;0,0"
      dur="2s"
      begin="0s"
      fill="freeze"
      keyTimes="0;0.3;0.45;0.6;0.75;0.9;1"
    />

    <!-- Pendulum swing group - pivot at (200, 0) -->
    <g>
      <!-- Initial damped swing -->
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 200 0;12 200 0;-8 200 0;5 200 0;-3 200 0;1.5 200 0;-1 200 0;0.5 200 0;0 200 0"
        dur="3s"
        begin="2s"
        fill="freeze"
        keyTimes="0;0.12;0.25;0.37;0.5;0.62;0.75;0.87;1"
      />

      <!-- Continuous gentle sway -->
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 200 0;1.5 200 0;0 200 0;-1.5 200 0;0 200 0"
        dur="4s"
        begin="5s"
        repeatCount="indefinite"
        additive="sum"
      />

      <!-- ===== STRAP ===== -->
      <!-- Strap segments (V-shape from anchor) -->
      <path d="M 200,0 L 170,130 L 170,265" stroke="url(#strapGrad)" stroke-width="22" fill="none" stroke-linecap="round"/>
      <path d="M 200,0 L 230,130 L 230,265" stroke="url(#strapGrad)" stroke-width="22" fill="none" stroke-linecap="round"/>

      <!-- Strap printed text -->
      <text class="mono" x="175" y="80" fill="rgba(255,255,255,0.6)" font-size="7" font-weight="700" letter-spacing="2" transform="rotate(-12,175,80)">KRISH</text>
      <text class="mono" x="210" y="80" fill="rgba(255,255,255,0.6)" font-size="7" font-weight="700" letter-spacing="2" transform="rotate(12,210,80)">KUMAR</text>
      <text class="mono" x="172" y="150" fill="rgba(255,255,255,0.4)" font-size="6" letter-spacing="1">DEV</text>
      <text class="mono" x="222" y="150" fill="rgba(255,255,255,0.4)" font-size="6" letter-spacing="1">2024</text>
      <text class="mono" x="170" y="210" fill="rgba(255,255,255,0.35)" font-size="5" letter-spacing="2">SOFTWARE</text>
      <text class="mono" x="215" y="210" fill="rgba(255,255,255,0.35)" font-size="5" letter-spacing="2">ENGINEER</text>

      <!-- ===== METAL CLASP ===== -->
      <rect x="175" y="255" width="50" height="20" rx="4" fill="#b0b0b0" filter="url(#metalShine)"/>
      <rect x="178" y="258" width="44" height="14" rx="2" fill="#d0d0d0"/>
      <line x1="200" y1="256" x2="200" y2="274" stroke="#a0a0a0" stroke-width="1"/>

      <!-- Metal ring -->
      <circle cx="200" cy="288" r="12" fill="none" stroke="#c0c0c0" stroke-width="3" filter="url(#metalShine)"/>
      <circle cx="200" cy="288" r="12" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
      <!-- Ring highlight -->
      <path d="M 192,280 A 12,12 0 0,1 208,280" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>

      <!-- ===== ID CARD ===== -->
      <g filter="url(#cardShadow)">
        <rect x="120" y="290" width="160" height="260" rx="12" fill="url(#cardGrad)" stroke="#2d1b3d" stroke-width="1.5"/>
      </g>

      <!-- Card inner border -->
      <rect x="126" y="296" width="148" height="248" rx="9" fill="none" stroke="rgba(192,132,252,0.15)" stroke-width="0.5"/>

      <!-- Connection from ring to card -->
      <line x1="200" y1="299" x2="200" y2="290" stroke="#c0c0c0" stroke-width="2"/>

      <!-- ===== AVATAR AREA ===== -->
      <!-- Glowing avatar ring -->
      <circle cx="200" cy="370" r="47" fill="none" stroke="url(#avatarRingGrad)" stroke-width="3" filter="url(#ringGlow)">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>

      <!-- Avatar image (cropped face) - Replace base64 with your actual image -->
      <g clip-path="url(#avatarClip)">
        <image
          x="158"
          y="328"
          width="84"
          height="84"
          href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
        />
      </g>

      <!-- ===== TEXT INFO ===== -->
      <!-- Name -->
      <text class="mono" x="200" y="438" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="2">KRISH KUMAR</text>

      <!-- Role -->
      <text class="mono" x="200" y="456" text-anchor="middle" fill="#c084fc" font-size="10" letter-spacing="1">SOFTWARE ENGINEER</text>

      <!-- Divider line -->
      <line x1="145" y1="466" x2="255" y2="466" stroke="rgba(192,132,252,0.3)" stroke-width="0.5"/>

      <!-- Handle -->
      <text class="mono" x="200" y="482" text-anchor="middle" fill="#ff6b9d" font-size="10">@krishgf</text>

      <!-- Email (small) -->
      <text class="mono" x="200" y="498" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7">krishkumar3757@gmail.com</text>

      <!-- Divider -->
      <line x1="145" y1="508" x2="255" y2="508" stroke="rgba(192,132,252,0.3)" stroke-width="0.5"/>

      <!-- Barcode -->
      <g transform="translate(150, 516)">
        <rect x="0" y="0" width="2" height="20" fill="rgba(255,255,255,0.6)"/>
        <rect x="4" y="0" width="1" height="20" fill="rgba(255,255,255,0.4)"/>
        <rect x="7" y="0" width="3" height="20" fill="rgba(255,255,255,0.6)"/>
        <rect x="12" y="0" width="1" height="20" fill="rgba(255,255,255,0.3)"/>
        <rect x="15" y="0" width="2" height="20" fill="rgba(255,255,255,0.5)"/>
        <rect x="19" y="0" width="1" height="20" fill="rgba(255,255,255,0.4)"/>
        <rect x="22" y="0" width="3" height="20" fill="rgba(255,255,255,0.6)"/>
        <rect x="27" y="0" width="1" height="20" fill="rgba(255,255,255,0.3)"/>
        <rect x="30" y="0" width="2" height="20" fill="rgba(255,255,255,0.5)"/>
        <rect x="34" y="0" width="1" height="20" fill="rgba(255,255,255,0.4)"/>
        <rect x="37" y="0" width="3" height="20" fill="rgba(255,255,255,0.6)"/>
        <rect x="42" y="0" width="2" height="20" fill="rgba(255,255,255,0.3)"/>
        <rect x="46" y="0" width="1" height="20" fill="rgba(255,255,255,0.5)"/>
        <rect x="49" y="0" width="3" height="20" fill="rgba(255,255,255,0.6)"/>
        <rect x="54" y="0" width="1" height="20" fill="rgba(255,255,255,0.4)"/>
        <rect x="57" y="0" width="2" height="20" fill="rgba(255,255,255,0.5)"/>
        <rect x="61" y="0" width="1" height="20" fill="rgba(255,255,255,0.3)"/>
        <rect x="64" y="0" width="3" height="20" fill="rgba(255,255,255,0.6)"/>
        <rect x="69" y="0" width="1" height="20" fill="rgba(255,255,255,0.4)"/>
        <rect x="72" y="0" width="2" height="20" fill="rgba(255,255,255,0.5)"/>
        <rect x="76" y="0" width="3" height="20" fill="rgba(255,255,255,0.6)"/>
        <rect x="81" y="0" width="1" height="20" fill="rgba(255,255,255,0.3)"/>
        <rect x="84" y="0" width="2" height="20" fill="rgba(255,255,255,0.5)"/>
        <rect x="88" y="0" width="1" height="20" fill="rgba(255,255,255,0.4)"/>
        <rect x="91" y="0" width="2" height="20" fill="rgba(255,255,255,0.6)"/>
        <rect x="95" y="0" width="1" height="20" fill="rgba(255,255,255,0.3)"/>
        <rect x="98" y="0" width="2" height="20" fill="rgba(255,255,255,0.5)"/>
      </g>

      <!-- ===== HOLOGRAPHIC SHINE SWEEP ===== -->
      <g clip-path="url(#cardClip)">
        <rect x="-160" y="290" width="160" height="260" fill="url(#holoShine)" opacity="0.6">
          <animate attributeName="x" from="-160" to="280" dur="3s" begin="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>