<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="tBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0015"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="tGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
      <feFlood flood-color="#ff6b9d" flood-opacity="0.3"/>
      <feComposite operator="in" in2="SourceGraphic"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tClip">
      <rect x="0" y="0" width="800" height="200" rx="12"/>
    </clipPath>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <g clip-path="url(#tClip)">
    <rect width="800" height="200" rx="12" fill="url(#tBg)" stroke="#2d1b3d" stroke-width="1"/>

    <!-- Trophy cells -->
    <!-- Trophy 1: Stars -->
    <g transform="translate(20, 20)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" from="0.5" to="1" begin="0.3s" dur="0.4s" fill="freeze" additive="sum"/>
      <rect x="0" y="0" width="110" height="160" rx="8" fill="#110820" stroke="#ff6b9d" stroke-width="1" opacity="0.8"/>
      <text x="55" y="50" text-anchor="middle" font-size="36">⭐</text>
      <text class="mono" x="55" y="85" text-anchor="middle" fill="#ff6b9d" font-size="10" font-weight="700">STARS</text>
      <text class="mono" x="55" y="105" text-anchor="middle" fill="#ffd700" font-size="16" font-weight="700" filter="url(#tGlow)">S+</text>
      <text class="mono" x="55" y="125" text-anchor="middle" fill="#b794d0" font-size="9">42 earned</text>
      <rect x="15" y="135" width="80" height="3" rx="1.5" fill="#ff6b9d" opacity="0.4"/>
    </g>

    <!-- Trophy 2: Commits -->
    <g transform="translate(140, 20)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" from="0.5" to="1" begin="0.5s" dur="0.4s" fill="freeze" additive="sum"/>
      <rect x="0" y="0" width="110" height="160" rx="8" fill="#110820" stroke="#c084fc" stroke-width="1" opacity="0.8"/>
      <text x="55" y="50" text-anchor="middle" font-size="36">🔥</text>
      <text class="mono" x="55" y="85" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="700">COMMITS</text>
      <text class="mono" x="55" y="105" text-anchor="middle" fill="#ffd700" font-size="16" font-weight="700" filter="url(#tGlow)">A+</text>
      <text class="mono" x="55" y="125" text-anchor="middle" fill="#b794d0" font-size="9">256 total</text>
      <rect x="15" y="135" width="80" height="3" rx="1.5" fill="#c084fc" opacity="0.4"/>
    </g>

    <!-- Trophy 3: PRs -->
    <g transform="translate(260, 20)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" from="0.5" to="1" begin="0.7s" dur="0.4s" fill="freeze" additive="sum"/>
      <rect x="0" y="0" width="110" height="160" rx="8" fill="#110820" stroke="#a855f7" stroke-width="1" opacity="0.8"/>
      <text x="55" y="50" text-anchor="middle" font-size="36">🔀</text>
      <text class="mono" x="55" y="85" text-anchor="middle" fill="#a855f7" font-size="10" font-weight="700">PRs</text>
      <text class="mono" x="55" y="105" text-anchor="middle" fill="#c0c0c0" font-size="16" font-weight="700">A</text>
      <text class="mono" x="55" y="125" text-anchor="middle" fill="#b794d0" font-size="9">18 merged</text>
      <rect x="15" y="135" width="80" height="3" rx="1.5" fill="#a855f7" opacity="0.4"/>
    </g>

    <!-- Trophy 4: Issues -->
    <g transform="translate(380, 20)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" from="0.5" to="1" begin="0.9s" dur="0.4s" fill="freeze" additive="sum"/>
      <rect x="0" y="0" width="110" height="160" rx="8" fill="#110820" stroke="#ff6b9d" stroke-width="1" opacity="0.8"/>
      <text x="55" y="50" text-anchor="middle" font-size="36">❗</text>
      <text class="mono" x="55" y="85" text-anchor="middle" fill="#ff6b9d" font-size="10" font-weight="700">ISSUES</text>
      <text class="mono" x="55" y="105" text-anchor="middle" fill="#c0c0c0" font-size="16" font-weight="700">A</text>
      <text class="mono" x="55" y="125" text-anchor="middle" fill="#b794d0" font-size="9">12 closed</text>
      <rect x="15" y="135" width="80" height="3" rx="1.5" fill="#ff6b9d" opacity="0.4"/>
    </g>

    <!-- Trophy 5: Repos -->
    <g transform="translate(500, 20)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" from="0.5" to="1" begin="1.1s" dur="0.4s" fill="freeze" additive="sum"/>
      <rect x="0" y="0" width="110" height="160" rx="8" fill="#110820" stroke="#c084fc" stroke-width="1" opacity="0.8"/>
      <text x="55" y="50" text-anchor="middle" font-size="36">📦</text>
      <text class="mono" x="55" y="85" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="700">REPOS</text>
      <text class="mono" x="55" y="105" text-anchor="middle" fill="#cd7f32" font-size="16" font-weight="700">B+</text>
      <text class="mono" x="55" y="125" text-anchor="middle" fill="#b794d0" font-size="9">15 public</text>
      <rect x="15" y="135" width="80" height="3" rx="1.5" fill="#c084fc" opacity="0.4"/>
    </g>

    <!-- Trophy 6: Followers -->
    <g transform="translate(620, 20)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" from="0.5" to="1" begin="1.3s" dur="0.4s" fill="freeze" additive="sum"/>
      <rect x="0" y="0" width="110" height="160" rx="8" fill="#110820" stroke="#a855f7" stroke-width="1" opacity="0.8"/>
      <text x="55" y="50" text-anchor="middle" font-size="36">👥</text>
      <text class="mono" x="55" y="85" text-anchor="middle" fill="#a855f7" font-size="10" font-weight="700">FOLLOWERS</text>
      <text class="mono" x="55" y="105" text-anchor="middle" fill="#c0c0c0" font-size="16" font-weight="700">A</text>
      <text class="mono" x="55" y="125" text-anchor="middle" fill="#b794d0" font-size="9">growing</text>
      <rect x="15" y="135" width="80" height="3" rx="1.5" fill="#a855f7" opacity="0.4"/>
    </g>

    <!-- Shine sweep across all trophies -->
    <rect x="-200" y="0" width="200" height="200" fill="url(#shineGrad)" opacity="0.8">
      <animate attributeName="x" from="-200" to="800" dur="4s" begin="2s" repeatCount="indefinite"/>
    </rect>

    <!-- Border glow -->
    <rect width="800" height="200" rx="12" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.15">
      <animate attributeName="stroke-opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>